<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProAlpha Monitor</title>
  <script>
    /* Apply the saved theme before the page draws (no flash). No saved choice = follow the OS. */
    try { var th = localStorage.getItem("theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#overview"><span class="logo" aria-hidden="true"></span><span data-i18n="app.title">ProAlpha Monitor</span></a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <input id="global-q" type="search" aria-label="Vevő keresése" aria-autocomplete="list" aria-controls="suggest">
        <button type="submit" data-i18n="search.open">Megnyitás</button>
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </form>
      <label class="period-pick" title="">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <select id="period" aria-label="Időszak / Period"></select>
      </label>
      <div class="seg amt-pick" id="amt" role="group" aria-label="Nettó / bruttó"></div>
      <div class="topbar-right">
        <span id="fake-tag" class="tag" hidden></span>
        <span id="freshness">…</span>
      </div>
    </div>
  </header>
  <div class="tabbar"><nav class="tabs wrap" id="tabs" aria-label="Main"></nav></div>

  <main class="wrap">
    <div id="banner" class="notice" hidden></div>
    <div id="view" style="display: contents"></div>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
