<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProAlpha Monitor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#overview"><span class="logo" aria-hidden="true"></span><span data-i18n="app.title">ProAlpha Monitor</span></a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <input id="global-q" type="search" aria-label="Vevő keresése" aria-autocomplete="list" aria-controls="suggest">
        <button type="submit" data-i18n="search.open">Megnyitás</button>
        <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      </form>
      <div class="topbar-right">
        <span id="fake-tag" class="tag" hidden></span>
        <span id="freshness">…</span>
        <label class="lang"><span class="sr-only" data-i18n="lang" hidden>Nyelv</span>
          <select id="lang" aria-label="Nyelv / Language">
            <option value="hu">Magyar</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <div class="tabbar"><nav class="tabs wrap" id="tabs" aria-label="Main"></nav></div>

  <main class="wrap">
    <div id="banner" class="notice" hidden></div>
    <div id="view" style="display: contents"></div>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head">
      <h2 id="detail-title"></h2>
      <button type="button" class="secondary" id="detail-close">✕</button>
    </div>
    <div id="detail-body"></div>
  </dialog>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
