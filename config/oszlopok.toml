# =============================================================================
#  OSZLOPCÍMEK – ezt a fájlt kézzel szerkesztheti
# =============================================================================
#
#  Bal oldalon a program mezőneve áll (NE módosítsa),
#  jobb oldalon az SAP export oszlopcíme idézőjelben (ezt írja át, ha kell).
#
#  - Kis- és nagybetű, valamint a felesleges szóközök nem számítanak.
#  - Ha egy oszlopcím többször szerepel az exportban, a #2, #3 … utótaggal
#    választhat: "FelvDátum#2" = a második "FelvDátum" oszlop. Utótag nélkül
#    mindig az elsőt használja.
#  - Ha egy mezőre nincs szükség, tegyen elé # jelet (megjegyzés lesz).
#  - Mentés után az importáló egy percen belül újra beolvassa az adatokat.
#    Ha hibás a fájl, a hibaüzenet a naplóban látszik:  docker compose logs importer
#
#  Minden exportfajtát a "felismeres" oszlopai alapján ismer fel: ha egy CSV
#  fájlban ezek mind megvannak, akkor az az export.
# =============================================================================


# -----------------------------------------------------------------------------
#  Zárolt vevők kihagyása
# -----------------------------------------------------------------------------
#  Ha a vevő neve vagy keresőfogalma tartalmazza a felsorolt jelzők bármelyikét,
#  a vevő kimarad az importból. Kis/nagybetű és ékezet nem számít, tehát a
#  "ZÁROLT" jelző a "zárolt", "Zarolt", "*ZAROLT*" írásmódot is kiszűri.
#  A kihagyott vevők számlái is kimaradnak.
[zarolt]
jelzok = ["ZÁROLT"]


# -----------------------------------------------------------------------------
#  Vevők export
# -----------------------------------------------------------------------------
[vevok]
felismeres = ["id", "name"]

[vevok.oszlopok]
id               = "Vevő"
name             = "Név"       # ha a Név oszlop a pontos cégnév: "Név"
search_term      = "Keresőfogalom"
account_manager  = "Ügyintéző"
created          = "FelvDátum"         # 4 FelvDátum oszlop van – ellenőrizze, melyik a vevőé (#2, #3, #4)
country          = "Orsz"
region           = "Régió"             # kód → név: kodlistak.toml [regiok]
industry         = "Ágazat"            # kód → név: kodlistak.toml [agazatok]
currency         = "Pn"                # kód → pénznem: kodlistak.toml [penznemek]
payment_terms    = "FizE"              # fizetési esedékesség napokban (1 = 1 nap)
payment_method   = "FizM"              # kód → név: kodlistak.toml [fizetesi_modok]
association      = "Társulás"
group            = "Konszern"
tax_number       = "Belföldi adószám"
eu_vat_number    = "Közösségi adószám"
supplier_id      = "Szállítói szám"
email            = "E-mail"
phone            = "Telefon"
street           = "Utca"
house_number     = "Házszám"
city             = "Város"
postal_code      = "ISz"               # 2 ISz oszlop van; az első a cím irányítószáma


# -----------------------------------------------------------------------------
#  Számlák export (bizonylatfejek)
# -----------------------------------------------------------------------------
#  Egy sor = egy bizonylat. A bizonylatfajtát a BF oszlop adja meg; az export
#  számlákat, ajánlatokat, szállítóleveleket stb. vegyesen tartalmaz.
#  A bizonylatok a vevőszám alapján kapcsolódnak a vevőkhöz.
#  Ugyanaz a számla az exportban többször is szerepelhet (azonos sorokként):
#  ezeket a belső bizonylatazonosító (doc_id) alapján egyszer számolja.
#  Később a számlatételek (cikkek) egy új szakasszal adhatók hozzá.
[szamlak]
felismeres = ["id", "customer_id", "date", "net"]

# Bizonylatfajták (BF oszlop):
#   szamla_bf  – forgalomként számít (R = számla, VFP)
#   ajanlat_bf – ajánlat: csak darabszám és lista ügyintézőnként, sosem forgalom
#   minden más kimarad (pl. L = szállítólevél, mert a számlája már benne van; U)
#   Az Import állapota fülön látszik, melyik fajtából mennyi érkezett.
szamla_bf  = ["R", "VFP"]
ajanlat_bf = ["A"]

# Ezek a számlatípusok (SzlT) negatív előjellel számítanak (jóváírás).
# Az Import állapota fülön látszik, milyen típusok érkeztek az exportban.
negativ_tipusok = ["Jóváírás"]

[szamlak.oszlopok]
doc_id          = "V_BelegKopf_Obj"    # belső bizonylatazonosító (az ismétlődő sorok összevonásához)
id              = "BizSz"              # számlaszám
customer_id     = "Vevő"
date            = "Bizonylatdátum"     # ez alapján kerül egy időszakba; teljesítés szerint: "Adódátum#3"
tax_date        = "Adódátum#3"         # 3 Adódátum oszlop van; csak a harmadik van kitöltve
net             = "Végösszeg"          # nettó végösszeg
gross           = "Br. végösszeg"      # bruttó végösszeg
currency        = "Pn"                 # kód → pénznem: kodlistak.toml [penznemek]
kind            = "SzlT"               # számlatípus (Számla, Jóváírás, …)
cancelled       = "Sto"                # sztornózva (Igen/Nem)
origin          = "BF"                 # bizonylatfajta: R = számla, A = ajánlat, L = szállítólevél, …
clerk           = "Ügyintéző"          # a bizonylatot kiállító felhasználó (párosítás: kodlistak.toml [ugyintezok])
rate            = "Valutaárf."         # árfolyam: 1 deviza hány forint (HUF számlán 1); ebből lesz a forintra átváltott összeg
# Ha az export egyszer saját forint-összeget ad (pl. "Végösszeg IP" kitöltve), az árfolyam helyett az is használható:
# net_local     = "Végösszeg IP"
# Fizetési adat (kiegyenlítés dátuma) nincs a számlafej-exportban, ezért a
# nyitott számlák nézet ki van kapcsolva. Ha lesz ilyen oszlop:
# cleared       = "…"
