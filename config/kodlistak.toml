# =============================================================================
#
#  Formátum:   "kód" = "megnevezés"
#  - A kód elején álló nullák nem számítanak: "05" és "5" ugyanaz.
#  - Ha az exportban olyan kód van, ami itt nem szerepel, az oldalon maga a kód
#    látszik, és az importáló figyelmeztet rá (kódonként egyszer).
#  - Mentés után az importáló egy percen belül újra beolvassa az adatokat.
# =============================================================================


