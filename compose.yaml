# Shared setup for development and production.
#   Development (Fedora):    docker compose up --build
#                            (compose.override.yaml is merged in automatically)
#   Production (Debian/Ubuntu): docker compose -f compose.yaml -f compose.prod.yaml up -d --build

name: proalpha-monitor

services:
  web:
    build: ./web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Clean data written by the importer, served at /data/
      - dashboard-data:/srv/data:ro
      - /etc/localtime:/etc/localtime:ro

  importer:
    build: ./importer
    environment:
      IMPORT_INTERVAL: "${IMPORT_INTERVAL:-60}"   # seconds between checks for new exports
      STABLE_SECONDS: "${STABLE_SECONDS:-60}"     # skip files changed this recently (still being written)
      CONFIG_DIR: /app/config
    volumes:
      # Hand-edited column names and code lists. Changes are picked up automatically.
      - ./config:/app/config:ro,z
      # SAP export files land here. "z" = shared SELinux label (only matters on SELinux hosts; ignored elsewhere).
      - "${EXPORTS_DIR:-./exports}:/exports:ro,z"
      - dashboard-data:/data
      # Log timestamps in the server's local time (no time zone package needed in the image)
      - /etc/localtime:/etc/localtime:ro

volumes:
  dashboard-data:
