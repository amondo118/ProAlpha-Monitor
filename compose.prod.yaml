# Production only. Use together with compose.yaml (this skips compose.override.yaml):
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  web:
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # logs never fill the disk
    ports: !override
      - "${WEB_PORT:-80}:80"

  importer:
    restart: unless-stopped
    logging: *logging
    environment:
      FAKE_DATA: "0"
