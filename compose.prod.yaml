# Production only. Use together with compose.yaml (this skips compose.override.yaml):
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  web:
    restart: unless-stopped
    ports: !override
      - "${WEB_PORT:-80}:80"

  importer:
    restart: unless-stopped
    environment:
      FAKE_DATA: "0"
